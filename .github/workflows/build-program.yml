# Rebuilds program.json whenever the programme sources change.
# Put the technical-program PDF and/or the Word proceedings file in source/
# and push: this regenerates program.json, commits it, and GitHub Pages redeploys.
name: Rebuild programme data

on:
  push:
    paths:
      - 'source/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-docx pdfplumber

      - name: Rebuild program.json
        run: |
          shopt -s nullglob
          FILES=(source/*.pdf source/*.docx)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No .pdf or .docx found in source/"; exit 1
          fi
          printf 'Building from: %s\n' "${FILES[@]}"
          python3 tools/build_program.py "${FILES[@]}" -o program.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- program.json; then
            echo "program.json unchanged."
          else
            git add program.json
            git commit -m "Rebuild program.json from ${GITHUB_SHA::7}"
            git push
          fi
